[pypi."."]
[pypi.".".project]
name = "mobilerun"
version = "0.7.4"
description = "A framework for controlling mobile devices through LLM agents"
authors = [{ name = "Niels Schmidt", email = "niels@droidrun.ai" }]
dependencies = [
    "async_adbutils",
    "llama-index==0.14.23",
    "posthog>=6.7.6",
    "pydantic>=2.11.10",
    "rich>=14.1.0",
    "InquirerPy>=0.3.4",
    "opentelemetry-exporter-otlp-proto-http>=1.40.0",
    "opentelemetry-sdk>=1.40.0",
    "httpx>=0.27.0",
    "filelock>=3.20.0",
    "PyJWT[crypto]>=2.14.0",
    "llama-index-callbacks-arize-phoenix>=0.6.1",
    "llama-index-workflows>=2.16.0,<3.0.0",
    "aiofiles>=25.1.0",
    "mcp>=1.28.1,<2.0.0",
    "llama-index-llms-openai==0.7.10",
    "llama-index-llms-openai-like==0.7.2",
    "llama-index-llms-google-genai>=0.8.5",
    "llama-index-llms-ollama>=0.7.2",
    "llama-index-llms-openrouter>=0.4.2",
    "mobilerun-sdk>=3.2.0",
    "mobilerun-core-local[cloud]>=0.6.3",
    # Security floors also protect installations from the published wheel.
    "aiohttp>=3.14.4",
    "anyio>=4.14.2",
    "certifi>=2026.10.19",
    "fsspec>=2026.6.0",
    "Pillow>=13.0.0",
    "urllib3>=2.8.0",
]
requires-python = ">=3.11,<3.14"
readme = "README.md"
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Communications :: Chat",
    "Topic :: Software Development :: Testing :: Acceptance",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: System :: Emulators",
    "Topic :: Utilities",
]

[pypi.".".project.urls]
Homepage = "https://github.com/droidrun/mobilerun"
"Bug Tracker" = "https://github.com/droidrun/mobilerun/issues"
Documentation = "https://docs.mobilerun.ai/"

[pypi.".".project.optional-dependencies]
anthropic = [
    "anthropic>=0.67.0,<2",
    "llama-index-llms-anthropic>=0.8.6,<0.9.0",
]
deepseek = []
dev = [
    "black==26.10.1",
    "ruff>=0.13.0",
    "mypy>=1.0.0",
    "pytest>=8.0.0",
    "bandit>=1.8.6",
    "safety>=3.2.11",
    "mobilerun[langfuse]",
]
langfuse = [
    "langfuse==4.15.1",
    "openinference-instrumentation-llama-index>=3.0.0",
    "llama-index-instrumentation"
]

[pypi.".".build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[pypi.".".tool.hatch.metadata]
allow-direct-references = true

[pypi.".".tool.hatch.build.targets.wheel]
packages = ["mobilerun"]

[pypi.".".project.scripts]
mobilerun = "mobilerun.cli.main:cli"

[pypi.".".tool.uv]
override-dependencies = ["filelock>=4.2.1"]

[pypi.".".tool.ruff]
line-length = 100
target-version = "py313"

[pypi.".".tool.pytest.ini_options]
pythonpath = ["."]

[pypi.".".tool.ruff.lint]
select = [
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "F", # pyflakes
    "I", # isort
    "B", # flake8-bugbear
]
ignore = ["E501"]

[pypi.".".dependency-groups]
dev = [
    "anthropic>=0.67.0,<2",
    "bandit>=1.8.6",
    "llama-index-callbacks-arize-phoenix>=0.6.1",
    "llama-index-llms-anthropic>=0.8.6,<0.9.0",
    "pytest>=8.0.0",
    "ruff>=0.13.0",
    "safety>=3.2.11",
]

[test.pypi."."]
command = ["pytest", "--import-mode=append"]
groups = ["dev"]

[install.pypi."."]
groups = ["dev"]

[project]
exclude = ["compat"]

